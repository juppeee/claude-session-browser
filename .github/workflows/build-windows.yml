name: Windows build

# Builds the app exactly like build.bat does on the release machine and keeps
# the result as a workflow artifact. A test tag (vX.Y.Z-something) also
# publishes the files as a pre-release that is never marked "latest", so the
# built-in updater (releases/latest + version.json on main) does not see it.
# Regular tags (vX.Y.Z) are not handled here.

on:
  push:
    branches: [main]
    tags: ['v*-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Check that a test tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          app=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' claude_sessions.py)
          iss=$(sed -n 's/^#define MyAppVersion "\(.*\)"/\1/p' setup.iss)
          echo "tag=$base app=$app setup.iss=$iss"
          if [ "$base" != "$app" ] || [ "$base" != "$iss" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($app) / setup.iss ($iss)"
            exit 1
          fi

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.3 pywebview==6.2.1 pystray==0.19.5 Pillow==13.0.0
          pip freeze
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          (Get-Item $iscc).VersionInfo.ProductVersion
          "ISCC=`"$iscc`"" >> $env:GITHUB_ENV

      - name: Unit tests
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: build.bat
        shell: cmd
        run: call build.bat < NUL

      - name: Checksums
        shell: bash
        run: |
          cd dist
          ls -l ClaudeSessionBrowser-Setup.exe ClaudeSessionBrowser.exe csb_updater.exe
          sha256sum ClaudeSessionBrowser-Setup.exe ClaudeSessionBrowser.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClaudeSessionBrowser-${{ github.sha }}
          path: |
            dist/ClaudeSessionBrowser-Setup.exe
            dist/ClaudeSessionBrowser.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ClaudeSessionBrowser-${{ github.sha }}
          path: dist

      - name: Publish pre-release (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease --latest=false \
            --title "$GITHUB_REF_NAME (test build)" \
            --notes "Test build from ${GITHUB_SHA}. Not an update for users: this pre-release is not marked latest, and the in-app updater only follows the latest release and version.json on main." \
            ClaudeSessionBrowser-Setup.exe ClaudeSessionBrowser.exe SHA256SUMS.txt
